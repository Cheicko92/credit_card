name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_qualification:
        description: "Lancer l'évaluation complète (coûteuse)"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 1" # chaque lundi, évaluation complète

jobs:
  quick-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Style (Ruff)
        run: ruff check .
      - name: Tests rapides + couverture
        run: pytest -m "not slow" --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  full-qualification:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_qualification)
    runs-on: ubuntu-latest
    needs: quick-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Évaluation complète (tests lents inclus)
        run: pytest -m slow
      - name: Rapport de qualification sur le jeu Kaggle réel (kagglehub)
        env:
          # Facultatif : le jeu est public ; à définir dans Settings > Secrets si Kaggle l'exige
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/run_qualification.py --download --require-real
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
